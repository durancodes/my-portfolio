<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duranjai V. | AI Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050505;
    --card-bg: #0f0f0f;
    --text: #ffffff;
    --text-dim: #a1a1aa;
    --primary: #3b82f6;
    --border: #27272a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: var(--text);
}

.container { max-width: 1000px; margin: auto; padding: 0 1.5rem; }

section { padding: 4rem 0; }

h2 {
    font-size: 1.8rem;
    margin-bottom: 2rem;
    border-left: 4px solid var(--primary);
    padding-left: 1rem;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 2rem;
    border-radius: 16px;
}

.btn {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 0.8rem 1.8rem;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 1rem;
}

iframe {
    width: 100%;
    height: 600px;
    border: none;
    margin-top: 2rem;
}
</style>
</head>

<body>

<div class="container">

<section>
<h2>Resume</h2>

<div class="card" style="text-align:center;">

<p style="color: var(--text-dim);">
You can download or view my complete resume below.
</p>

<a href="latest.pdf" download class="btn">
Download Resume (PDF)
</a>

<iframe src="latest.pdf"></iframe>

</div>

</section>

</div>

</body>
</html>
